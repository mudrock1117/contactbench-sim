_target_: diffusion_policy.workspace.train_diffusion_unet_hybrid_workspace.TrainDiffusionUnetHybridWorkspace
name: contactbench_card_official_dp
task_name: retrieve_card_from_deck
exp_name: official_b1
shape_meta:
  action: {shape: [10]}
  obs:
    wrist_rgb: {shape: [3, 240, 320], type: rgb}
    agent_pos: {shape: [10], type: low_dim}
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: 2
past_action_visible: false
keypoint_visible_rate: 1.0
obs_as_global_cond: true
policy:
  _target_: diffusion_policy.policy.diffusion_unet_hybrid_image_policy.DiffusionUnetHybridImagePolicy
  shape_meta: ${shape_meta}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: true
    prediction_type: epsilon
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_global_cond: true
  crop_shape: [76, 76]
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  obs_encoder_group_norm: true
  eval_fixed_crop: true
ema: {_target_: diffusion_policy.model.diffusion.ema_model.EMAModel, update_after_step: 0, inv_gamma: 1.0, power: 0.75, min_value: 0.0, max_value: 0.9999}
dataloader: {batch_size: 64, num_workers: 8, shuffle: true, pin_memory: true, persistent_workers: false}
val_dataloader: {batch_size: 64, num_workers: 8, shuffle: false, pin_memory: true, persistent_workers: false}
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6
training:
  device: cuda:0
  seed: 0
  debug: false
  resume: false
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 501
  gradient_accumulate_every: 1
  use_ema: true
  freeze_encoder: false
  rollout_every: 1000000
  checkpoint_every: 25
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
task:
  dataset:
    _target_: force_bench.dp.official_dataset.ContactBenchOfficialDPDataset
    data_path: ${oc.env:TB_DP_DATA,outputs/datasets/card_multimodal}
    policy_hz: 12
    observation_horizon: 2
    horizon: 16
    camera: wrist
    success_only: true
    seed: 0
    val_ratio: 0.0
  env_runner:
    _target_: force_bench.dp.official_runner.ContactBenchOfflineImageRunner
logging: {project: contactbench-dp, resume: true, mode: online, name: "${name}", tags: [contactbench, official-dp, card], id: null, group: null}
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk: {monitor_key: train_loss, mode: min, k: 3, format_str: "epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt"}
multi_run: {run_dir: outputs/dp/official_card, wandb_name_base: "${name}"}
